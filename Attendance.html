<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0C1319;--sf:#151E27;--s2:#1C2733;--tx:#E7EEF3;--mu:#8FA1AF;--ln:#26333F;--ac:#34C3B9;--as:#12302E;--on:#06201E;--p:#34D07A;--a:#FF6B70;--s:#F5B02E;--r:#6BA0FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .35s,color .35s}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 110px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-style:normal}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-weight:800;margin-left:6px;transition:transform .15s,background .3s}
.ib:active{transform:scale(.9)}

.db{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.db .ib{margin:0;flex:none;font-size:20px}
.dl{flex:1;position:relative;text-align:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 8px;font-weight:800}

.sm{display:flex;align-items:center;gap:18px;background:var(--as);border-color:transparent}
.rg{width:96px;height:96px;flex:none}

.cs{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.cn b{display:block;font-size:20px;line-height:1.1}
.cn span{font-size:11.5px;color:var(--mu)}
.cn i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.q{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;padding:12px 8px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);font-weight:700;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.95)}
.pr{background:var(--ac);color:var(--on);border-color:var(--ac)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;margin-bottom:8px;transition:background .35s}
.in{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.vw{animation:fd .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes fd{from{opacity:0}}
@keyframes pop{40%{transform:scale(1.3)}}

.nm small{color:var(--mu)}

.bt button{width:36px;height:36px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);color:var(--mu);font-weight:800;transition:transform .15s,background .25s}

.bt .on{color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.on.p{background:var(--p)}.on.a{background:var(--a)}.on.s{background:var(--s)}.on.r{background:var(--r)}
.pop{animation:pop .35s}

.seg .on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;font-weight:700;margin-bottom:6px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,34px) 44px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);text-align:center;font-weight:700}
.tr.d{grid-template-columns:minmax(0,1fr) repeat(4,34px)}
.tr.tot{border:0;font-size:16px}
.tn{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;font-weight:600}
.tr b:first-child{text-align:left}
.sh{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sh .btn{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:13px}
.sh span{font-size:20px}
.f{width:100%;box-sizing:border-box;background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:11px}
.fr{display:flex;gap:8px;margin-top:8px}.fr .btn{flex:none;padding:11px 16px}
.em{text-align:center;padding:36px 12px;color:var(--mu)}.em div{font-size:44px}.em .btn{margin-top:12px;flex:none;padding:12px 20px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);z-index:5}
.nav button{flex:1;max-width:170px;border:0;background:none;border-radius:14px;padding:6px;font-size:12px;font-weight:700;color:var(--mu);transition:all .3s}
.nav span{display:block;font-size:20px;transition:transform .3s}
.nav .on{background:var(--as);color:var(--ac)}.nav .on span{transform:translateY(-2px) scale(1.15)}
.ts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;display:flex;gap:14px;align-items:center;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:9;max-width:90vw}
.ts.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.ts button{border:0;background:none;color:var(--ac);font-weight:800;filter:brightness(1.4)}
@media(max-width:400px){.av{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap"><header><div class="logo"><i>✓</i><span id="tt"></span></div><div><button class="ib" id="lb" data-a="lang" aria-label="Language"></button><button class="ib" id="th" data-a="theme" aria-label="Theme"></button></div></header><main id="app"></main></div>

<script>

function range(rp=RP){let a=new Date(D),b=new Date(D);if(rp=='week'){a.setDate(a.getDate()-(a.getDay()+6)%7);b=new Date(a);b.setDate(a.getDate()+6)}
